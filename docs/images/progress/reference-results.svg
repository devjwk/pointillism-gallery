<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc"><title id="title">참조 시점에서 기록한 픽셀 차이</title><desc id="desc">실사진 1장, 같은 메쉬, 8,000점, 시드 42. 0에서 255 범위 sRGB 픽셀의 평균 절대 오차 MAE. 표면 면적 균일 62.19287787543403, 원본 시점 투영 가중 43.412882486979164. 낮을수록 원본 픽셀에 가깝습니다. 지각 품질·3D 정확도 점수가 아닙니다. 단일 사진·단일 시드 관측값으로 일반적 우수성을 주장하지 않습니다.</desc><style>text{font-family:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#f1efe9;font-weight:400}.serif{font-family:'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;font-weight:500}.muted{fill:#b9b7b2}.rule{stroke:#343434;stroke-width:1;fill:none}</style><rect width="1400" height="650" fill="#000000"/>
