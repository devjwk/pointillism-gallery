<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580" role="img" aria-labelledby="title desc"><title id="title">검증된 알고리즘을, 실제 감상 경험으로</title><desc id="desc">검증 단계 01 사진 기준선 검증: 다양한 입력과 실패 사례. 02 3D 생성 경로 확인: 일회성 GPU, 숨은 면은 추정. 03 구조 보존 점묘 개선: 같은 점 수·시드·시점 비교. 04 메인 사이트 통합: 업로드, 변환, 감상, 저장. 상시 GPU 서버는 후순위. 일정이 아닌 검증 단계.</desc><style>text{font-family:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#f1efe9;font-weight:400}.serif{font-family:'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;font-weight:500}.muted{fill:#b9b7b2}.rule{stroke:#343434;stroke-width:1;fill:none}</style><rect width="1400" height="580" fill="#000000"/>
<text x="64" y="69" font-size="26" class="muted">다음 검증 단계</text>
<text x="64" y="146" font-size="50" class="serif">검증된 알고리즘을, 실제 감상 경험으로</text>
<path d="M64 193H1336" class="rule"/>
<text x="64" y="252" font-size="28" class="muted">01</text><text x="64" y="316" font-size="34" class="serif">사진 기준선</text><text x="64" y="362" font-size="34" class="serif">검증</text><text x="64" y="418" font-size="24" class="muted">다양한 입력과</text><text x="64" y="455" font-size="24" class="muted">실패 사례</text>
<text x="390" y="252" font-size="28" class="muted">02</text><text x="390" y="316" font-size="34" class="serif">3D 생성</text><text x="390" y="362" font-size="34" class="serif">경로 확인</text><text x="390" y="418" font-size="24" class="muted">일회성 GPU</text><text x="390" y="455" font-size="24" class="muted">숨은 면은 추정</text>
<text x="716" y="252" font-size="28" class="muted">03</text><text x="716" y="316" font-size="34" class="serif">구조 보존</text><text x="716" y="362" font-size="34" class="serif">점묘 개선</text><text x="716" y="418" font-size="24" class="muted">같은 점 수와 시드</text><text x="716" y="455" font-size="24" class="muted">같은 시점에서 비교</text>
<text x="1042" y="252" font-size="28" class="muted">04</text><text x="1042" y="316" font-size="34" class="serif">메인 사이트</text><text x="1042" y="362" font-size="34" class="serif">통합</text><text x="1042" y="418" font-size="24" class="muted">업로드→변환</text><text x="1042" y="455" font-size="24" class="muted">→감상→저장</text>
<path d="M64 496H1336" class="rule"/>
<text x="64" y="547" font-size="26" class="muted">상시 GPU 서버는 후순위 · 일정이 아닌 검증 단계</text></svg>